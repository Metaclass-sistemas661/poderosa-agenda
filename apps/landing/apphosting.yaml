# ═══════════════════════════════════════════════════════════════════════════════
# Firebase App Hosting — Poderosa Agenda
# https://firebase.google.com/docs/app-hosting/configure
#
# Region: us-east4
# Backend: poderosa-agenda
# Framework: Next.js 14 (App Router)
#
# QUOTA LIMITS (us-east4, Blaze plan):
#   - CpuAllocPerProjectRegion: 20,000 millicores (20 vCPUs)
#   - MemAllocPerProjectRegion: 40 GiB
#   - maxInstances * cpu must not exceed quota
#
# SCALING STRATEGY:
#   - minInstances: 0 (scale to zero for cost optimization)
#   - maxInstances: 4 (4 × 1 vCPU = 4,000m, well within 20,000m quota)
#   - concurrency: 80 (Next.js handles concurrent requests efficiently)
#   - Effective capacity: 4 × 80 = 320 concurrent requests
#
# TO INCREASE CAPACITY:
#   1. Request quota increase: https://console.cloud.google.com/iam-admin/quotas
#   2. Update maxInstances proportionally (max 20 with 1 vCPU)
#   3. Commit and push — App Hosting auto-deploys
# ═══════════════════════════════════════════════════════════════════════════════

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # ─────────────────────────────────────────────────────────────────────────────
  # Supabase Configuration (via Google Cloud Secret Manager)
  #
  # Secrets are managed via:
  #   firebase apphosting:secrets:set <SECRET_NAME> --project poderosa-agenda
  #
  # Access must be granted to the App Hosting backend service account:
  #   firebase apphosting:secrets:grantaccess <SECRET_NAME> \
  #     --project poderosa-agenda --backend poderosa-agenda --location us-east4
  # ─────────────────────────────────────────────────────────────────────────────

  # Public URL for Supabase (exposed to client-side)
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: SUPABASE_URL

  # Public anon key for Supabase (exposed to client-side, RLS-protected)
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: SUPABASE_ANON_KEY

  # Server-side anon key for SSR/API routes
  - variable: SUPABASE_ANON_KEY
    secret: SUPABASE_ANON_KEY

  # Server-side service role key for Admin/Provisioning tasks
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY

  # ─────────────────────────────────────────────────────────────────────────────
  # Site URL (canonical production domain)
  # Used for OAuth redirects, webhooks, email links, etc.
  # ─────────────────────────────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://poderosaagenda.com.br

  # Resend for Emails
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  # ─────────────────────────────────────────────────────────────────────────────
  # Cron Secret (for email queue processing endpoint)
  # Used to authenticate calls to /api/cron/process-emails
  #
  # Create via:
  #   firebase apphosting:secrets:set CRON_SECRET --project poderosa-agenda
  #   firebase apphosting:secrets:grantaccess CRON_SECRET --project poderosa-agenda --backend poderosa-agenda --location us-east4
  # ─────────────────────────────────────────────────────────────────────────────
  - variable: CRON_SECRET
    secret: CRON_SECRET

  # ─────────────────────────────────────────────────────────────────────────────
  # Contact Form Configuration
  #
  # Email de destino para mensagens do formulário de contato
  # Create via:
  #   firebase apphosting:secrets:set CONTACT_FORM_EMAIL --project poderosa-agenda
  #   (Digite: contato@poderosaagenda.com.br)
  #   firebase apphosting:secrets:grantaccess CONTACT_FORM_EMAIL --project poderosa-agenda --backend poderosa-agenda --location us-east4
  # ─────────────────────────────────────────────────────────────────────────────
  - variable: CONTACT_FORM_EMAIL
    secret: CONTACT_FORM_EMAIL

  # Habilitar envio de email de confirmação para o usuário (true/false)
  - variable: CONTACT_FORM_SEND_CONFIRMATION
    value: "true"

  # ─────────────────────────────────────────────────────────────────────────────
  # Mercado Pago (DESABILITADO - Aguardando configuração de secrets)
  #
  # Para habilitar, execute:
  #   firebase apphosting:secrets:set MP_ACCESS_TOKEN --project poderosa-agenda
  #   firebase apphosting:secrets:set MP_WEBHOOK_SECRET --project poderosa-agenda
  #   firebase apphosting:secrets:grantaccess MP_ACCESS_TOKEN --project poderosa-agenda --backend poderosa-agenda --location us-east4
  #   firebase apphosting:secrets:grantaccess MP_WEBHOOK_SECRET --project poderosa-agenda --backend poderosa-agenda --location us-east4
  #
  # Depois, descomente as linhas abaixo:
  # - variable: MP_ACCESS_TOKEN
  #   secret: MP_ACCESS_TOKEN
  # - variable: MP_WEBHOOK_SECRET
  #   secret: MP_WEBHOOK_SECRET
  # ─────────────────────────────────────────────────────────────────────────────
